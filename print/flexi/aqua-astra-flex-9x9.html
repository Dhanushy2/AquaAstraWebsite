<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aqua Astra Flex 9x9</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ── Flex banner, 9 × 9 ft (same layout as the 8 × 8, printed 12.5% larger) ──
     Laid out at 243.84 × 243.84 mm; the print step scales it ×11.25 (1 mm here = 1.125 cm
     on the banner) onto a 2743.2 × 2743.2 mm page. Text, icons and QR
     stay vector; important content stays 6 mm (6.75 cm real) inside the edge. */
  @page { size: 243.84mm 243.84mm; margin: 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  :root {
    --teal-ink: #0e6e78;
    --mint: #bdf3e8;
  }
  html, body { margin: 0; padding: 0; }
  body { background: #dfe6ec; font-family: "Poppins", sans-serif; color: #1e293b; }
  .flex {
    position: relative; width: 243.84mm; height: 243.84mm; overflow: hidden; margin: 8mm auto;
    background: radial-gradient(150mm 140mm at 50% 34%, #ffffff 0%, #f3fbfd 55%, #e3f4f8 100%);
    box-shadow: 0 6px 24px rgba(15, 40, 60, .18);
  }
  @media print { body { background: none; } .flex { margin: 0; box-shadow: none; } }
  .abs { position: absolute; }
  .icon { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .full { left: 0; top: 0; width: 100%; height: 100%; }

  /* Top: deities, company name, logo */
  .sai { left: 14mm; top: 10mm; height: 19mm; }
  .ganesha { left: 50%; top: 9mm; height: 14mm; transform: translateX(-50%); }
  .krishna { right: 14mm; top: 10mm; height: 17.5mm; }
  /* Gradient headings are SVG text: CSS background-clip text leaves faint boxes in the PDF. */
  .co-top { left: 0; top: 25mm; width: 243.84mm; height: 12mm; overflow: visible; }
  .gtext { font-family: "Poppins", sans-serif; font-weight: 700; fill: url(#g-text); }
  .logo { left: 50%; top: 38mm; width: 122mm; transform: translateX(-50%); mix-blend-mode: multiply; }

  /* Promise badges: Good Seed (left), Good Medicine (right), Good Price (bottom, on the wave). */
  .badge { text-align: center; }
  .badge.l { left: 12mm; top: 62mm; width: 52mm; }
  .badge.r { right: 12mm; top: 62mm; width: 52mm; }
  .badge.b { left: 50%; top: 124mm; width: 60mm; transform: translateX(-50%); }
  .badge .disc { width: 34mm; height: 34mm; margin: 0 auto; padding: 1.2mm; border-radius: 50%; background: linear-gradient(135deg, #00695c 0%, #0e6e78 45%, #007acc 100%); box-shadow: 0 0 0 1.8mm rgba(32, 176, 156, .16); }
  .badge .disc img { display: block; width: 100%; height: 100%; border-radius: 50%; border: 1.2mm solid #fff; box-sizing: border-box; background: #fff; }
  .badge svg.lbl { display: block; width: 52mm; height: 9mm; margin-top: 1.6mm; overflow: visible; }
  .badge.b .disc { width: 32mm; height: 32mm; box-shadow: 0 0 0 1.8mm rgba(255, 255, 255, .22); }
  .badge.b b { display: block; margin-top: 1.8mm; font-size: 16pt; font-weight: 700; line-height: 1.2; color: #fff; white-space: nowrap; }

  /* Bottom: the wave band with phone + QR, address, name */
  .wave { left: 0; bottom: 0; width: 100%; height: 118mm; }
  .row { left: 12mm; right: 12mm; display: flex; justify-content: center; align-items: center; color: #fff; white-space: nowrap; line-height: 1; }
  .callrow { top: 173mm; gap: 8mm; }
  .call { display: flex; align-items: center; gap: 3.6mm; font-size: 25pt; font-weight: 700; letter-spacing: .02em; }
  .call i { display: grid; place-items: center; width: 12mm; height: 12mm; border-radius: 50%; background: #fff; color: var(--teal-ink); }
  .call i svg { width: 7.2mm; height: 7.2mm; stroke-width: 2.1; }
  .call .ways { display: block; margin-top: 2.2mm; font-size: 11.5pt; font-weight: 600; letter-spacing: .1em; color: var(--mint); }
  .call .ways span { display: inline-flex; align-items: center; gap: 1.6mm; }
  .call .ways svg { width: 5.4mm; height: 5.4mm; color: #25d366; }
  .waqr { width: 27mm; padding: 2mm 2mm 1.6mm; border-radius: 3.4mm; background: #fff; text-align: center; }
  .waqr img { display: block; width: 100%; }
  .waqr span { display: flex; justify-content: center; align-items: center; gap: 1mm; margin-top: .9mm; font-size: 8pt; font-weight: 700; letter-spacing: .04em; color: #1da851; line-height: 1.2; }
  .waqr span svg { width: 3.8mm; height: 3.8mm; }

  .addr { top: 222mm; gap: 2.6mm; font-size: 12.5pt; }
  .addr i { display: grid; place-items: center; width: 7.6mm; height: 7.6mm; border-radius: 50%; background: #fff; color: var(--teal-ink); }
  .addr i svg { width: 5mm; height: 5mm; stroke-width: 2.1; }
  .name { top: 208.5mm; }
  .name b { font-size: 21pt; font-weight: 700; }
  .name small { margin-left: 2.6mm; font-size: 17pt; font-weight: 500; letter-spacing: .04em; color: var(--mint); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h3.5l1.7 4.4-2.2 1.4a11 11 0 0 0 6.2 6.2l1.4-2.2L20 15.5V19a1.5 1.5 0 0 1-1.6 1.5A16.5 16.5 0 0 1 3.5 5.6 1.5 1.5 0 0 1 5 4z"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="i-feed" viewBox="0 0 24 24"><circle cx="8" cy="9" r="2.6"/><circle cx="15.5" cy="8" r="2.6"/><circle cx="11.5" cy="15" r="2.6"/><circle cx="18" cy="15.5" r="2"/><circle cx="5.5" cy="16" r="2"/></symbol>
    <symbol id="i-medicine" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M12 9v7M8.5 12.5h7"/><path d="M8 5V3.5h8V5"/></symbol>
    <symbol id="i-seed" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.6"/><g fill="currentColor" stroke="none"><circle cx="12" cy="12" r="1.4"/><circle cx="8.6" cy="10" r="1.1"/><circle cx="15.3" cy="9.6" r="1.1"/><circle cx="9.8" cy="15.2" r="1.1"/><circle cx="14.8" cy="14.9" r="1.1"/><circle cx="12" cy="7.2" r=".9"/><circle cx="12.2" cy="17.2" r=".9"/><circle cx="7" cy="13.3" r=".9"/><circle cx="17.1" cy="12.6" r=".9"/></g></symbol>
    <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12.04 2a9.9 9.9 0 0 0-8.5 14.98L2 22l5.17-1.5A9.9 9.9 0 1 0 12.04 2Zm0 18.1a8.2 8.2 0 0 1-4.18-1.14l-.3-.18-3.07.9.92-2.99-.2-.31a8.2 8.2 0 1 1 6.83 3.72Zm4.5-6.14c-.25-.12-1.46-.72-1.69-.8-.23-.09-.39-.13-.56.12-.16.25-.64.8-.78.97-.14.16-.29.18-.54.06a6.7 6.7 0 0 1-1.98-1.22 7.4 7.4 0 0 1-1.37-1.7c-.14-.25-.02-.38.1-.5.11-.11.25-.29.37-.43.12-.15.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.41-.56-.42h-.47c-.16 0-.43.06-.65.31-.23.25-.86.84-.86 2.05s.88 2.38 1 2.55c.12.16 1.73 2.64 4.19 3.7.59.25 1.04.4 1.4.52.59.19 1.12.16 1.54.1.47-.07 1.46-.6 1.66-1.17.2-.58.2-1.08.14-1.18-.06-.1-.23-.16-.48-.29Z"/></symbol>
    <linearGradient id="g-wave" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#00695c"/><stop offset=".45" stop-color="#0e6e78"/><stop offset="1" stop-color="#007acc"/></linearGradient>
    <linearGradient id="g-wave-back" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#20b09c"/><stop offset="1" stop-color="#2aa2f7"/></linearGradient>
  </defs>
</svg>

<section class="flex">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="g-text" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#00695c"/><stop offset=".45" stop-color="#0e6e78"/><stop offset="1" stop-color="#007acc"/></linearGradient>
  </defs></svg>

  <svg class="abs full" viewBox="0 0 243.84 243.84" aria-hidden="true">
    <g fill="none" stroke="#0e6e78">
      <ellipse cx="121.92" cy="82" rx="68" ry="50" stroke-opacity=".06" stroke-width=".6"/>
      <ellipse cx="121.92" cy="82" rx="102" ry="78" stroke-opacity=".05" stroke-width=".6"/>
      <ellipse cx="121.92" cy="82" rx="140" ry="108" stroke-opacity=".04" stroke-width=".6"/>
    </g>
  </svg>

  <!-- Bubbles as SVG circles (CSS radial gradients mis-encode in the scaled PDF). -->
  <svg class="abs full" viewBox="0 0 243.84 243.84" aria-hidden="true">
    <defs>
      <radialGradient id="g-bubble" cx=".5" cy=".5" r=".5" fx=".32" fy=".3">
        <stop offset="0" stop-color="#ffffff"/><stop offset=".2" stop-color="#ffffff"/>
        <stop offset=".5" stop-color="#d6f0f9"/><stop offset="1" stop-color="#a9d3ea"/>
      </radialGradient>
    </defs>
    <g fill="url(#g-bubble)" stroke="#8cc4e3" stroke-width=".3">
      <circle cx="58" cy="45" r="3.2"/><circle cx="62" cy="54" r="1.6"/><circle cx="66" cy="112" r="2.4"/>
      <circle cx="186" cy="44" r="2.6"/><circle cx="182" cy="52" r="1.4"/><circle cx="178" cy="114" r="2.8"/>
      <circle cx="12" cy="60" r="1.8"/><circle cx="232" cy="66" r="2"/><circle cx="30" cy="122" r="1.6"/><circle cx="214" cy="124" r="1.8"/>
    </g>
  </svg>

  <img class="abs sai" src="assets/saibaba-brand.png" alt="Sai Baba" />
  <img class="abs ganesha" src="assets/ganesha-brand.png" alt="Lord Ganesha" />
  <img class="abs krishna" src="assets/krishna-brand.png" alt="Lord Krishna playing the flute" />
  <svg class="abs co-top" viewBox="0 0 243.84 12" aria-label="Aqua Astra Enterprises"><text class="gtext" x="121.92" y="6" text-anchor="middle" dominant-baseline="central" font-size="8" letter-spacing=".48">Aqua Astra Enterprises</text></svg>
  <img class="abs logo" src="assets/logo-grow-together-hd.png" alt="Aqua Astra — Grow Together" />

  <svg class="abs wave" viewBox="0 0 243.84 118" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 8C36 2 70 11 110 5.5S187 .5 243.84 5V118H0z" fill="url(#g-wave-back)" fill-opacity=".35"/>
    <path d="M0 14C41 9.5 77 16 121 12S198 9.5 243.84 13V118H0z" fill="url(#g-wave)"/>
    <path d="M0 14C41 9.5 77 16 121 12S198 9.5 243.84 13" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width=".5"/>
    <path d="M0 113C46 110.5 87 114.5 134 112S206 110 243.84 112" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width=".4"/>
  </svg>

  <div class="abs badge l"><div class="disc"><img src="assets/promise-seed.svg" alt="Good Seed" /></div><svg class="lbl" viewBox="0 0 52 9" aria-label="Good Seed"><text class="gtext" x="26" y="4.5" text-anchor="middle" dominant-baseline="central" font-size="6">Good Seed</text></svg></div>
  <div class="abs badge r"><div class="disc"><img src="assets/promise-medicine.png" alt="Good Medicine" /></div><svg class="lbl" viewBox="0 0 52 9" aria-label="Good Medicine"><text class="gtext" x="26" y="4.5" text-anchor="middle" dominant-baseline="central" font-size="6">Good Medicine</text></svg></div>
  <div class="abs badge b"><div class="disc"><img src="assets/promise-price.png" alt="Good Price" /></div><b>Good Price</b></div>

  <div class="abs row callrow">
    <div class="call"><i><svg class="icon"><use href="#i-phone"/></svg></i><div>+91 79894 67777<span class="ways"><span>CALL ·<svg viewBox="0 0 24 24"><use href="#i-wa"/></svg>WHATSAPP</span></span></div></div>
    <div class="waqr"><img src="assets/qr-whatsapp.svg" alt="QR code: WhatsApp +91 79894 67777" /><span><svg viewBox="0 0 24 24"><use href="#i-wa"/></svg>WHATSAPP</span></div>
  </div>
  <div class="abs row name"><b>Yarlagadda Srinivasa Rao</b><small>(YSR) - MA</small></div>
  <div class="abs row addr"><i><svg class="icon"><use href="#i-pin"/></svg></i>6-137, 1st Floor, Arthamuru, Bantumilli, Krishna District, Andhra Pradesh 521369</div>
</section>

</body>
</html>
